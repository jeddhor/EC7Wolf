name: Release

# Cutting a release.
#
# Triggered by pushing a tag, so the tag is the record of what was released and
# the version the engine reports matches it -- src/versiondefs.cmake counts
# commits since the original plan's last milestone, and git describe finds the
# tag, so a build from this workflow says exactly which release it is.
#
# Every binary here is produced by tools/make_release.py, which builds through
# the installer's own build module rather than a separate CMake invocation
# written for CI. That is the point: the released binaries come from the same
# code that builds one on a user's machine, so the two cannot drift, and every
# release exercises the SDL2 and libepoxy fetching that a person would
# otherwise be the first to try.
#
# No game data is in any artifact. The player brings their Corridor 7 CD.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (must already exist)'
        required: true

permissions:
  contents: write

jobs:
  engine:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            runner: ubuntu-latest
          - name: Linux arm64
            runner: ubuntu-24.04-arm
          - name: Windows x64
            runner: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the version counts commits; a shallow clone cannot

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install what the build needs (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build \
            libsdl2-dev libsdl2-mixer-dev libsdl2-net-dev zlib1g-dev \
            libjpeg-dev libbz2-dev libepoxy-dev

      # Nothing to install on Windows: the installer's own build module fetches
      # SDL2 and builds libepoxy, and finds Visual Studio by itself.
      - name: Build and stage the engine
        run: python tools/make_release.py engine --into staging/engine

      # Built here rather than in a job of its own, because this is where it is
      # needed: the Windows -full archive has to contain a runnable installer,
      # and a folder of .py files whose entry point has no extension is not one.
      - name: Build the frozen installer (Windows)
        if: runner.os == 'Windows'
        run: |
          pip install pyinstaller PySide6
          python installer/windows/build_setup.py

      - name: Package
        shell: bash
        run: |
          extra=""
          if [ -f dist/EC7Wolf-Setup.exe ]; then
            extra="--setup-exe dist/EC7Wolf-Setup.exe"
          fi
          python tools/make_release.py package --engine staging/engine \
            --out packages --kinds binaries,full $extra
          cp dist/EC7Wolf-Setup.exe packages/ 2>/dev/null || true

      - uses: actions/upload-artifact@v7
        with:
          name: engine-${{ matrix.runner }}
          path: packages/*
          if-no-files-found: error

  portable:
    name: Installer and source packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python tools/make_release.py package --out dist --kinds installer,source
      - uses: actions/upload-artifact@v7
        with:
          name: portable
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: [engine, portable]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Gather what was built
        run: |
          mkdir -p dist
          find artifacts -type f -exec cp {} dist/ \;
          ls -la dist

      # A last check that no game data slipped into an artifact. The engine and
      # the installer are free software; MAPTEMP.CO7 and its siblings are not
      # ours to hand out, and an accident here would be a licensing problem
      # rather than a bug.
      - name: Refuse to publish anything carrying game data
        run: |
          found=$(find dist -type f \( -iname '*.CO7' -o -iname 'CORR7*' \) -print)
          if [ -n "$found" ]; then
            echo "Corridor 7 game data found in the release artifacts:"
            echo "$found"
            exit 1
          fi
          for archive in dist/*.zip; do
            [ -e "$archive" ] || continue
            if unzip -l "$archive" | grep -iE '\.CO7|CORR7CD' ; then
              echo "game data inside $archive"; exit 1
            fi
          done
          for archive in dist/*.tar.gz; do
            [ -e "$archive" ] || continue
            if tar -tzf "$archive" | grep -iE '\.CO7|CORR7CD' ; then
              echo "game data inside $archive"; exit 1
            fi
          done
          echo "clean: no game data in any artifact"

      - name: Write the release notes
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          cat > notes.md <<'PREAMBLE'
          **You need your own copy of Corridor 7: Alien Invasion.** Nothing in
          this release contains the game's data. The CD-ROM release — the disc,
          or the BIN/CUE image sold by GOG and Steam — is the one to use: it is
          the only one carrying the soundtrack and the cinematics.

          ### Which file do I want?

          **On Windows, take `EC7Wolf-Setup.exe`.** One self-contained file:
          it needs nothing installed, and it takes the game's data, soundtrack
          and cinematics off your CD for you.

          **On Linux, take `…-linux-x64-full.tar.gz`** (or `-arm64-` on a
          Raspberry Pi or other aarch64 machine). It has the engine and the
          installer together.

          Everything else, if you want it:

          | File | What is inside | What to run |
          | --- | --- | --- |
          | `EC7Wolf-Setup.exe` | the whole installer, frozen into one file | itself |
          | `*-windows-x64-full.zip` | the engine, its DLLs, **and `EC7Wolf-Setup.exe`** | `EC7Wolf-Setup.exe` |
          | `*-windows-x64.zip` | the engine and its DLLs, nothing else | `EC7Wolf.cmd`, once your `.CO7` files are beside it |
          | `*-linux-x64-full.tar.gz`<br>`*-linux-arm64-full.tar.gz` | the engine and the installer | `./installer/ec7wolf-setup` |
          | `*-linux-x64.tar.gz`<br>`*-linux-arm64.tar.gz` | the engine, nothing else | `./run-ec7wolf.sh`, once your `.CO7` files are beside it |
          | `*-installer.zip` | the installer as Python, no engine — it downloads the source and builds it | `installer/ec7wolf-setup` (needs Python and PySide6) |
          | `*-source.tar.gz` | the complete source | see the README |

          Every archive has an `INSTALL.txt` at the top saying the same thing
          for that particular download.

          See the [README](https://github.com/jeddhor/EC7Wolf#installing-and-running)
          for all six ways to install this, in detail.
          PREAMBLE
          sed -i 's/^          //' notes.md
          echo "" >> notes.md
          echo "### Changes" >> notes.md
          echo "" >> notes.md
          previous=$(git describe --tags --abbrev=0 "$tag^" 2>/dev/null || true)
          if [ -n "$previous" ]; then
            git log --no-merges --format='- %s' "$previous..$tag" >> notes.md
          else
            git log --no-merges --format='- %s' -20 "$tag" >> notes.md
          fi
          cat notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"

          # A beta is a pre-release, and saying otherwise would put it forward
          # as the version to download. GitHub decides that from this flag, not
          # from what the tag is called, so the tag has to be read here.
          prerelease=""
          case "$tag" in
            *alpha*|*beta*|*-rc*|*-pre*) prerelease="--prerelease" ;;
          esac

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
            # An existing release may predate this rule, or have been made by
            # hand; make it agree with the tag either way.
            if [ -n "$prerelease" ]; then
              gh release edit "$tag" --prerelease
            else
              gh release edit "$tag" --prerelease=false
            fi
          else
            gh release create "$tag" dist/* \
              --title "EC7Wolf $tag" --notes-file notes.md --verify-tag \
              $prerelease
          fi
