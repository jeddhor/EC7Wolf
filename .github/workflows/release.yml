name: Release

# Cutting a release.
#
# Triggered by pushing a tag, so the tag is the record of what was released and
# the version the engine reports matches it -- src/versiondefs.cmake counts
# commits since the original plan's last milestone, and git describe finds the
# tag, so a build from this workflow says exactly which release it is.
#
# Every binary here is produced by tools/make_release.py, which builds through
# the installer's own build module rather than a separate CMake invocation
# written for CI. That is the point: the released binaries come from the same
# code that builds one on a user's machine, so the two cannot drift, and every
# release exercises the SDL2 and libepoxy fetching that a person would
# otherwise be the first to try.
#
# No game data is in any artifact. The player brings their Corridor 7 CD.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (must already exist)'
        required: true

permissions:
  contents: write

jobs:
  engine:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            runner: ubuntu-latest
          - name: Linux arm64
            runner: ubuntu-24.04-arm
          - name: Windows x64
            runner: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the version counts commits; a shallow clone cannot

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install what the build needs (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build \
            libsdl2-dev libsdl2-mixer-dev libsdl2-net-dev zlib1g-dev \
            libjpeg-dev libbz2-dev libepoxy-dev

      # Nothing to install on Windows: the installer's own build module fetches
      # SDL2 and builds libepoxy, and finds Visual Studio by itself.
      - name: Build and stage the engine
        run: python tools/make_release.py engine --into staging/engine

      # Built here rather than in a job of its own, because this is where it is
      # needed: the Windows -full archive has to contain a runnable installer,
      # and a folder of .py files whose entry point has no extension is not one.
      - name: Build the frozen installer (Windows)
        if: runner.os == 'Windows'
        run: |
          pip install pyinstaller PySide6
          python installer/windows/build_setup.py

      # EC7Edit is frozen on the same runner as the engine it ships beside, so
      # each platform's editor is built by that platform. It goes out twice: as
      # a download of its own, for somebody who wants the editor and not the
      # engine, and inside -full, which is the download for somebody who wants
      # the lot.
      - name: Package the editor
        shell: bash
        run: |
          pip install pyinstaller PySide6
          tools/package_ec7edit.sh --output staging/editor --no-archive \
            --python "$(command -v python || command -v python3)"

      - name: Package
        shell: bash
        run: |
          extra=""
          if [ -f dist/EC7Wolf-Setup.exe ]; then
            extra="--setup-exe dist/EC7Wolf-Setup.exe"
          fi
          editor=""
          # One directory inside staging/editor, named for the version and the
          # platform. Found rather than spelled out, so the naming can change
          # without this file having to be edited in step.
          for candidate in staging/editor/*/; do
            [ -x "$candidate/ec7edit" ] || [ -f "$candidate/ec7edit.exe" ] || continue
            editor="--editor $candidate"
          done
          python tools/make_release.py package --engine staging/engine \
            --out packages --kinds binaries,full,editor $extra $editor
          cp dist/EC7Wolf-Setup.exe packages/ 2>/dev/null || true

      - uses: actions/upload-artifact@v7
        with:
          name: engine-${{ matrix.runner }}
          path: packages/*
          if-no-files-found: error

  android:
    name: Android APK
    runs-on: ubuntu-latest
    outputs:
      # Whether players can upgrade in place, which the release notes have to
      # say out loud because getting it wrong costs somebody their game data.
      signing: ${{ steps.key.outputs.signing }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the version counts commits; a shallow clone cannot

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # The host tools only: cross-compiling cannot run zipdir, so a native
      # build exports it first. That build is TOOLS_ONLY and links no SDL.
      - name: Install what the host tools need
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build zlib1g-dev

      - name: Make sure the SDK has what the build picks
        run: |
          sdk=${ANDROID_SDK_ROOT:-$ANDROID_HOME}
          [ -n "$sdk" ] || { echo "no Android SDK on this runner"; exit 1; }
          sdkmanager=$(command -v sdkmanager ||
            echo "$sdk/cmdline-tools/latest/bin/sdkmanager")
          [ -x "$sdkmanager" ] ||
            { echo "no sdkmanager at $sdkmanager"; exit 1; }
          yes | "$sdkmanager" --licenses >/dev/null 2>&1 || true
          "$sdkmanager" --install "platforms;android-36" \
            "build-tools;36.0.0" >/dev/null
          # build_android.sh takes the newest NDK present. The runner images
          # ship one; if that ever stops being true, say so here rather than
          # failing later inside CMake.
          ls -d "$sdk"/ndk/* >/dev/null 2>&1 ||
            { echo "no NDK on this runner"; exit 1; }
          ls -d "$sdk"/ndk/*
          # build_android.sh reads ANDROID_SDK_ROOT and falls back to a path
          # under $HOME that does not exist here, so pin it for later steps.
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"

      # An APK signed with a throwaway key cannot upgrade the one before it:
      # Android refuses an install whose signature changed, and uninstalling to
      # get past that takes the player's imported game data with it, because
      # app-specific storage goes when the app does. So a repository that has
      # set ANDROID_KEYSTORE_BASE64 signs every release with the same key and
      # players upgrade in place. Without the secret the build still produces a
      # working APK, and the release notes say what that costs.
      - name: Unlock the signing key, if this repository has one
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "ANDROID_KEYALIAS=${KEYSTORE_ALIAS:-ec7wolf}" >> "$GITHUB_ENV"
            echo "ANDROID_KEYPASS=$KEYSTORE_PASS" >> "$GITHUB_ENV"
            echo "signing with the repository's release key"
            echo "signing=release" >> "$GITHUB_OUTPUT"
          else
            echo "no ANDROID_KEYSTORE_BASE64 secret: a throwaway debug key"
            echo "will be generated, and this APK will not upgrade an earlier one"
            echo "signing=throwaway" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch SDL and the Vorbis encoder
        run: tools/fetch_android_deps.sh

      - name: Build both ABIs and the APK
        run: tools/build_android.sh

      # The same gate the local suite runs: both architectures present, all
      # five native libraries in each, signed under both schemes, and nothing
      # a player sees naming another app. It exits 0 when it decides to skip,
      # which in a release is the one answer that must not pass for success.
      - name: Check the APK is release-ready
        run: |
          builds=$(cd "$GITHUB_WORKSPACE/.." && pwd)/builds
          [ -f "$builds/android-arm64-v8a/ec7wolf.apk" ] ||
            { echo "no APK was built"; exit 1; }
          tools/test_android_apk.sh "$builds" | tee apk-gate.log
          if grep -q '^SKIP' apk-gate.log; then
            echo "the APK gate skipped itself; a release cannot ship unchecked"
            exit 1
          fi

      - name: Name it after the release
        run: |
          builds=$(cd "$GITHUB_WORKSPACE/.." && pwd)/builds
          release=$(python3 -c "import sys; sys.path.insert(0, 'tools'); \
            import make_release; print(make_release.version())")
          mkdir -p packages
          cp "$builds/android-arm64-v8a/ec7wolf.apk" \
             "packages/EC7Wolf-$release-android.apk"
          ls -la packages

      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: packages/*
          if-no-files-found: error

  portable:
    name: Installer and source packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python tools/make_release.py package --out dist --kinds installer,source
      - uses: actions/upload-artifact@v7
        with:
          name: portable
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: [engine, portable, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Gather what was built
        run: |
          mkdir -p dist
          find artifacts -type f -exec cp {} dist/ \;
          ls -la dist

      # A last check that no game data slipped into an artifact. The engine and
      # the installer are free software; MAPTEMP.CO7 and its siblings are not
      # ours to hand out, and an accident here would be a licensing problem
      # rather than a bug.
      - name: Refuse to publish anything carrying game data
        run: |
          found=$(find dist -type f \( -iname '*.CO7' -o -iname 'CORR7*' \) -print)
          if [ -n "$found" ]; then
            echo "Corridor 7 game data found in the release artifacts:"
            echo "$found"
            exit 1
          fi
          for archive in dist/*.zip; do
            [ -e "$archive" ] || continue
            if unzip -l "$archive" | grep -iE '\.CO7|CORR7CD' ; then
              echo "game data inside $archive"; exit 1
            fi
          done
          for archive in dist/*.tar.gz; do
            [ -e "$archive" ] || continue
            if tar -tzf "$archive" | grep -iE '\.CO7|CORR7CD' ; then
              echo "game data inside $archive"; exit 1
            fi
          done
          # An APK is a zip, and dist/*.zip does not match one. It carries
          # ec7wolf.pk3, which is this project's own free data, and must carry
          # nothing of the player's.
          for archive in dist/*.apk; do
            [ -e "$archive" ] || continue
            if unzip -l "$archive" | grep -iE '\.CO7|CORR7CD' ; then
              echo "game data inside $archive"; exit 1
            fi
          done
          echo "clean: no game data in any artifact"

      - name: Write the release notes
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          cat > notes.md <<'PREAMBLE'
          **You need your own copy of Corridor 7: Alien Invasion.** Nothing in
          this release contains the game's data. The CD-ROM release — the disc,
          or the BIN/CUE image sold by GOG and Steam — is the one to use: it is
          the only one carrying the soundtrack and the cinematics.

          ### Which file do I want?

          **On Windows, take `EC7Wolf-Setup.exe`.** One self-contained file:
          it needs nothing installed, and it takes the game's data, soundtrack
          and cinematics off your CD for you.

          **On Linux, take `…-linux-x64-full.tar.gz`.** It has the engine and
          the installer together. Take **`-arm64-`** instead on aarch64: a
          Raspberry Pi, an Odroid, or a Linux handheld such as a Retroid Pocket
          running Rocknix. Those builds are native, not emulated.

          **On Android, take `…-android.apk`.** Sideload it, then hand it a zip
          of your game files — or the CD image itself, which is the only way to
          get the soundtrack and the cinematics onto a phone. Play Protect will
          ask to upload the app to Google before it installs; **Don't send**
          installs it anyway.

          Everything else, if you want it:

          | File | What is inside | What to run |
          | --- | --- | --- |
          | `EC7Wolf-Setup.exe` | the whole installer, frozen into one file | itself |
          | `*-windows-x64-full.zip` | the engine, its DLLs, **and `EC7Wolf-Setup.exe`** | `EC7Wolf-Setup.exe` |
          | `*-windows-x64.zip` | the engine and its DLLs, nothing else | `EC7Wolf.cmd`, once your `.CO7` files are beside it |
          | `*-linux-x64-full.tar.gz`<br>`*-linux-arm64-full.tar.gz` | the engine and the installer | `./installer/ec7wolf-setup` |
          | `*-linux-x64.tar.gz`<br>`*-linux-arm64.tar.gz` | the engine, nothing else | `./run-ec7wolf.sh`, once your `.CO7` files are beside it |
          | `*-installer.zip` | the installer as Python, no engine — it downloads the source and builds it | `installer/ec7wolf-setup` (needs Python and PySide6) |
          | `*-android.apk` | the engine, the touch controls and the data importer, for `arm64-v8a` and `x86_64` | sideload it; it imports your game data itself |
          | `*-source.tar.gz` | the complete source | see the README |

          Every archive has an `INSTALL.txt` at the top saying the same thing
          for that particular download.

          See the [README](https://github.com/jeddhor/EC7Wolf#installing-and-running)
          for all seven ways to install this, in detail.
          PREAMBLE
          sed -i 's/^          //' notes.md

          if [ "${{ needs.android.outputs.signing }}" = "throwaway" ]; then
            cat >> notes.md <<'ANDROIDKEY'

          > **About the APK's signature.** This one was signed with a key
          > generated during the build, so a later release will not install
          > over it — Android refuses an install whose signing key changed.
          > Uninstalling first gets past that, but it also deletes the game
          > data you imported, because Android removes an app's storage with
          > the app. Re-importing takes about half a minute.
          ANDROIDKEY
            sed -i 's/^          //' notes.md
          fi

          echo "" >> notes.md
          echo "### Changes" >> notes.md
          echo "" >> notes.md
          previous=$(git describe --tags --abbrev=0 "$tag^" 2>/dev/null || true)
          if [ -n "$previous" ]; then
            git log --no-merges --format='- %s' "$previous..$tag" >> notes.md
          else
            git log --no-merges --format='- %s' -20 "$tag" >> notes.md
          fi
          cat notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"

          # A beta is a pre-release, and saying otherwise would put it forward
          # as the version to download. GitHub decides that from this flag, not
          # from what the tag is called, so the tag has to be read here.
          prerelease=""
          case "$tag" in
            *alpha*|*beta*|*-rc*|*-pre*) prerelease="--prerelease" ;;
          esac

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
            # An existing release may predate this rule, or have been made by
            # hand; make it agree with the tag either way.
            if [ -n "$prerelease" ]; then
              gh release edit "$tag" --prerelease
            else
              gh release edit "$tag" --prerelease=false
            fi
          else
            gh release create "$tag" dist/* \
              --title "EC7Wolf $tag" --notes-file notes.md --verify-tag \
              $prerelease
          fi
